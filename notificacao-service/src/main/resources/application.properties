spring.application.name=notificacao-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/notificacao}
spring.datasource.username=${DB_USERNAME:notificacao}
spring.datasource.password=${DB_PASSWORD:notificacao}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

notificacao.security.username=${NOTIFICACAO_USERNAME:staff}
notificacao.security.password=${NOTIFICACAO_PASSWORD:staff123}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
