spring.application.name=agendamento-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/agendamento}
spring.datasource.username=${DB_USERNAME:agendamento}
spring.datasource.password=${DB_PASSWORD:agendamento}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.graphql.graphiql.enabled=true
spring.graphql.path=/graphql

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
